name: PDFStudio Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================================
  # STAGE 1: Build, Test & Security Verification
  # ========================================================
  build-and-test:
    name: Build & Test (.NET & Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/PDFStudio.Web/package.json

      - name: Restore Backend Dependencies
        run: dotnet restore PDFStudio.slnx

      - name: Build Backend Solution
        run: dotnet build PDFStudio.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/PDFStudio.UnitTests/PDFStudio.UnitTests.csproj -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Run Security Tests (Multi-tenant isolation & Auth)
        run: dotnet test tests/PDFStudio.SecurityTests/PDFStudio.SecurityTests.csproj -c Release --no-build --verbosity normal

      - name: Run API Integration Tests
        run: dotnet test tests/PDFStudio.ApiTests/PDFStudio.ApiTests.csproj -c Release --no-build --verbosity normal

      - name: Run Integration Tests
        run: dotnet test tests/PDFStudio.IntegrationTests/PDFStudio.IntegrationTests.csproj -c Release --no-build --verbosity normal

      - name: Install Frontend Dependencies
        working-directory: src/PDFStudio.Web
        run: npm ci

      - name: Build Angular Web Application
        working-directory: src/PDFStudio.Web
        run: npm run build -- --configuration production

  # ========================================================
  # STAGE 2: Security & Vulnerability Auditing
  # ========================================================
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Audit NuGet Package Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

  # ========================================================
  # STAGE 3: Container Build Verification
  # ========================================================
  docker-build:
    name: Build & Verify Docker Images
    needs: [build-and-test, security-audit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Public API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.public-api
          push: false
          tags: pdfstudio-public-api:latest

      - name: Build Private API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.private-api
          push: false
          tags: pdfstudio-private-api:latest

      - name: Build Worker Host Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: pdfstudio-worker:latest

      - name: Build Web UI Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: pdfstudio-web:latest

