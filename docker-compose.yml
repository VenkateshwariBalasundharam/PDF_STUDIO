services:
  postgres:
    image: postgres:17-alpine
    container_name: pdfstudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdfstudio
      POSTGRES_USER: pdfuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/postgres/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - ./db/postgres/003_align_repositories.sql:/docker-entrypoint-initdb.d/003_align_repositories.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfuser -d pdfstudio"]
      interval: 5s
      timeout: 5s
      retries: 5

  public-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.public-api
    container_name: pdfstudio-public-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=pdfstudio;Username=pdfuser;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Storage__Provider=FileSystem
      - Storage__BasePath=/data/storage
    volumes:
      - document-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  private-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.private-api
    container_name: pdfstudio-private-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=pdfstudio;Username=pdfuser;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Storage__Provider=FileSystem
      - Storage__BasePath=/data/storage
    volumes:
      - document-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5001"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: pdfstudio-worker
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSQL=Host=postgres;Port=5432;Database=pdfstudio;Username=pdfuser;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Storage__Provider=FileSystem
      - Storage__BasePath=/data/storage
    volumes:
      - document-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: pdfstudio-web
    restart: unless-stopped
    ports:
      - "4200:80"

  gateway:
    image: caddy:2-alpine
    container_name: pdfstudio-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - public-api
      - private-api
      - web

volumes:
  pgdata:
  document-storage:

